[project]
name = "position-macro-tracker-backend"
version = "0.1.0"
description = "Local-first position and macro tracker backend"
requires-python = ">=3.11"
dependencies = [
  "apscheduler>=3.10.4",
  "fastapi>=0.115.0",
  "pydantic-settings>=2.6.0",
  "python-dotenv>=1.0.1",
  "sqlalchemy>=2.0.36",
  "uvicorn[standard]>=0.32.0",
]

[project.optional-dependencies]
providers = [
  "pandas>=2.2.3",
  "requests>=2.32.3",
  "yfinance>=0.2.50",
]
test = [
  "pytest>=8.3.3",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

